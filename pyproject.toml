[project]
name = "patienttriage"
version = "0.1.0"
description = "AI decision-support for emergency department triage: assist, never override."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pydantic>=2.9",
    "simpy>=4.1",
]

[project.optional-dependencies]
# Phase 2 only: the chief-complaint text branch. ~2.5 GB, installed on demand.
text = [
    "torch>=2.5",
    "transformers>=4.45",
    "sentence-transformers>=3.2",
]
# The browser console — `python -m patienttriage.ui.server`. Not required to train,
# evaluate or simulate; only to click through the assistant instead of reading a
# terminal.
ui = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patienttriage"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
